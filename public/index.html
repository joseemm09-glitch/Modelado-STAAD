d(\n                    x=data['x'], y=data['z'], z=data['y'],\n                    mode='lines',\n                    line=dict(color=data['color'], width=data['width']),\n                    name=name_map[grp_name],\n                    opacity=0.45 if grp_name == 'faded' else 1.0\n                ))\n    else:\n        largueros_added = False\n        for grp in group_order:\n            data = lines_by_group[grp]\n            if data['x']:\n                lw = 3 if (grp.startswith('_LARGUEROS') or grp in ['_JOISTGRAL', '_JPUNTAL']) else 4\n                hidden_legend_groups = ['_CS', '_CI', '_CS_PERIM', '_CI_PERIM', '_MONTANTES', '_DIAG', '_MONTANTES_PERIM', '_DIAG_PERIM', '_CS_SEC', '_CI_SEC', '_MONTANTES_SEC', '_DIAG_SEC']\n                \n                is_larguero = grp.startswith('_LARGUEROS')\n                show_leg = (grp not in hidden_legend_groups)\n                trace_name = grp\n                leg_group = None\n                \n                if is_larguero:\n                    trace_name = '_LARGUEROS'\n                    leg_group = '_LARGUEROS'\n                    if largueros_added:\n                        show_leg = False\n                    else:\n                        largueros_added = True\n                        show_leg = True\n                        \n                fig.add_trace(go.Scatter3d(\n                    x=data['x'],\n                    y=data['z'],\n                    z=data['y'],\n                    mode='lines',\n                    line=dict(color=data['color'], width=lw),\n                    name=trace_name,\n                    showlegend=show_leg,\n                    legendgroup=leg_group\n                ))\n                \n        if lines_by_group['unknown']['x']:\n            data = lines_by_group['unknown']\n            fig.add_trace(go.Scatter3d(\n                x=data['x'],\n                y=data['z'],\n                z=data['y'],\n                mode='lines',\n                line=dict(color=data['color'], width=4),\n                name='Otros',\n                showlegend=False\n            ))\n        \n    # Plot plates if any (Tilt-Up)\n    if getattr(model, 'plates', None):\n        px, py, pz = [], [], []\n        i_idx, j_idx, k_idx = [], [], []\n        idx = 0\n        \n        ox, oy, oz = [], [], [] # Outlines\n        \n        for pid, (n1, n2, n3, n4) in model.plates.items():\n            # Add to mesh\n            for n in [n1, n2, n3, n4]:\n                x, y, z = model.nodes[n]\n                px.append(x / 100.0)\n                py.append(z / 100.0) # Plotly Y is Model Z\n                pz.append(y / 100.0) # Plotly Z is Model Y\n                \n            i_idx.extend([idx, idx])\n            j_idx.extend([idx+1, idx+2])\n            k_idx.extend([idx+2, idx+3])\n            idx += 4\n            \n            # Add to outlines\n            for n in [n1, n2, n3, n4, n1]:\n                x, y, z = model.nodes[n]\n                ox.append(x / 100.0)\n                oy.append(z / 100.0)\n                oz.append(y / 100.0)\n            ox.append(None)\n            oy.append(None)\n            oz.append(None)\n            \n        fig.add_trace(go.Mesh3d(\n            x=px, y=py, z=pz,\n            i=i_idx, j=j_idx, k=k_idx,\n            color='lightgray',\n            opacity=0.15 if highlight_ids is not None else 0.65,\n            name='Muros (Plates)'\n        ))\n        \n        fig.add_trace(go.Scatter3d(\n            x=ox, y=oy, z=oz,\n            mode='lines',\n            line=dict(color='gray', width=2),\n            name='Bordes Muros',\n            showlegend=False\n        ))\n\n    node_opacity = 0.0 if highlight_ids is not None else 1.0\n    \n    # Also plot nodes as small dots\n    fig.add_trace(go.Scatter3d(\n        x=[n[0] / 100.0 for n in model.nodes.values()],\n        y=[n[2] / 100.0 for n in model.nodes.values()],\n        z=[n[1] / 100.0 for n in model.nodes.values()],\n        mode='markers',\n        marker=dict(size=2, color='black'),\n        name='Nodos',\n        showlegend=False,\n        opacity=node_opacity\n    ))\n\n    # Plot supports\n    if show_supports and model.base_nodes:\n        if model.support_type.upper() == \"RESORTE\":\n            rx, ry, rz = [], [], []\n            gx, gy, gz = [], [], []\n            bx, by, bz = [], [], []\n            L = 0.5   # Longitud de la línea paralela al eje (mitad de antes)\n            w = 0.75  # Longitud de la línea perpendicular (75% de antes)\n            d = 0.225 # Longitud de las diagonales (75% de antes)\n            \n            for nid in model.base_nodes:\n                nx = model.nodes[nid][0] / 100.0\n                ny = model.nodes[nid][2] / 100.0 # Plotly Y is Model Z\n                nz = model.nodes[nid][1] / 100.0 # Plotly Z is Model Y\n                \n                # GREEN (Resorte Y): línea paralela a Z Plotly (Y Model) hacia abajo\n                gx.extend([nx, nx, None])\n                gy.extend([ny, ny, None])\n                gz.extend([nz, nz - L, None])\n                # Perpendicular a lo largo de X Plotly\n                gx.extend([nx - w/2, nx + w/2, None])\n                gy.extend([ny, ny, None])\n                gz.extend([nz - L, nz - L, None])\n                # 4 Diagonales\n                for i in range(4):\n                    px = (nx - w/2) + i * (w / 3)\n                    gx.extend([px, px - d, None])\n                    gy.extend([ny, ny, None])\n                    gz.extend([nz - L, nz - L - d, None])\n                \n                # RED (Resorte X): línea paralela a X Plotly (X Model) hacia atrás (-X)\n                rx.extend([nx, nx - L, None])\n                ry.extend([ny, ny, None])\n                rz.extend([nz, nz, None])\n                # Perpendicular a lo largo de Z Plotly (Y Model)\n                rx.extend([nx - L, nx - L, None])\n                ry.extend([ny, ny, None])\n                rz.extend([nz - w/2, nz + w/2, None])\n                # 4 Diagonales\n                for i in range(4):\n                    pz = (nz - w/2) + i * (w / 3)\n                    rx.extend([nx - L, nx - L - d, None])\n                    ry.extend([ny, ny, None])\n                    rz.extend([pz, pz - d, None])\n                    \n                # BLUE (Resorte Z): línea paralela a Y Plotly (Z Model) hacia atrás (-Y Plotly)\n                bx.extend([nx, nx, None])\n                by.extend([ny, ny - L, None])\n                bz.extend([nz, nz, None])\n                # Perpendicular a lo largo de X Plotly\n                bx.extend([nx - w/2, nx + w/2, None])\n                by.extend([ny - L, ny - L, None])\n                bz.extend([nz, nz, None])\n                # 4 Diagonales\n                for i in range(4):\n                    px = (nx - w/2) + i * (w / 3)\n                    bx.extend([px, px - d, None])\n                    by.extend([ny - L, ny - L - d, None])\n                    bz.extend([nz, nz, None])\n                    \n            fig.add_trace(go.Scatter3d(x=rx, y=ry, z=rz, mode='lines', line=dict(color='red', width=3), name='Resorte X', legendgroup='resorte', showlegend=False))\n            fig.add_trace(go.Scatter3d(x=gx, y=gy, z=gz, mode='lines', line=dict(color='lime', width=3), name='Resorte Y', legendgroup='resorte', showlegend=False))\n            fig.add_trace(go.Scatter3d(x=bx, y=by, z=bz, mode='lines', line=dict(color='blue', width=3), name='Apoyos', legendgroup='resorte', showlegend=True))\n        else:\n            sup_x, sup_y, sup_z = [], [], []\n            is_fixed = (model.support_type.upper() == \"FIXED\")\n            \n            for nid in model.base_nodes:\n                nx = model.nodes[nid][0] / 100.0\n                ny = model.nodes[nid][2] / 100.0 # Plotly Y is Model Z\n                nz = model.nodes[nid][1] / 100.0 # Plotly Z is Model Y\n                \n                if is_fixed:\n                    w = 1.2\n                    h = 0.6\n                    sup_x.extend([nx - w/2, nx + w/2, nx + w/2, nx - w/2, nx - w/2, None])\n                    sup_y.extend([ny, ny, ny, ny, ny, None])\n                    sup_z.extend([nz, nz, nz - h, nz - h, nz, None])\n                else:\n                    w = 1.2\n                    h = 1.0\n                    sup_x.extend([nx, nx + w/2, nx - w/2, nx, None])\n                    sup_y.extend([ny, ny, ny, ny, None])\n                    sup_z.extend([nz, nz - h, nz - h, nz, None])\n                    \n            fig.add_trace(go.Scatter3d(\n                x=sup_x,\n                y=sup_y,\n                z=sup_z,\n                mode='lines',\n                line=dict(color='black', width=3),\n                name='Apoyos',\n                showlegend=True\n            ))\n\n    # Plot wind column supports (Articulaciones / Triángulos rojo oscuro)\n    if show_supports and getattr(model, 'wind_base_nodes', None):\n        wsup_x, wsup_y, wsup_z = [], [], []\n        w = 1.2\n        h = 1.0\n        for nid in model.wind_base_nodes:\n            nx = model.nodes[nid][0] / 100.0\n            ny = model.nodes[nid][2] / 100.0 # Plotly Y is Model Z\n            nz = model.nodes[nid][1] / 100.0 # Plotly Z is Model Y\n            \n            # Triángulo hueco. W=1.2, H=1.0\n            wsup_x.extend([nx, nx + w/2, nx - w/2, nx, None])\n            wsup_y.extend([ny, ny, ny, ny, None])\n            wsup_z.extend([nz, nz - h, nz - h, nz, None])\n            \n        name_support = 'Apoyos (Muro)' if getattr(model, 'wall_type', None) == 'Tilt-Up' else 'Apoyos (Viento)'\n        fig.add_trace(go.Scatter3d(\n            x=wsup_x,\n            y=wsup_y,\n            z=wsup_z,\n            mode='lines',\n            line=dict(color='darkred', width=3),\n            name=name_support,\n            showlegend=True\n        ))\n\n    # Custom grid ticks matching model dimensions\n    x_ticks = [i * model.Larm_m for i in range(model.nS .3f}\" else str(t_in)\n            nombre_staad = f\"HSST{B}X{B}X{t_str}\"\n            \n            # Radio de giro (cm)\n            r = math.sqrt(Ix / A)\n            \n            perfiles.append({\n                \"nombre\": nombre,\n                \"nombre_staad\": nombre_staad,\n                \"A\": A,\n                \"Ix\": Ix,\n                \"Sx\": Sx,\n                \"r\": r,\n                \"peso\": peso,\n                \"B\": B,\n                \"t\": t_in\n            })\n            \n    # Ordenar por peso\n    return sorted(perfiles, key=lambda x: x[\"peso\"])\n\ndef cargar_base_datos_excel():\n    perfiles = [\n        {'nombre': 'HSS4X4X1/8', 'nombre_staad': 'HSST4X4X0.125', 'A': 11.42, 'Ix': 183.14, 'Sx': 36.05, 'r': 4.0, 'peso': 8.96},\n        {'nombre': 'HSS4X4X3/16', 'nombre_staad': 'HSST4X4X0.188', 'A': 16.65, 'Ix': 258.48, 'Sx': 50.88, 'r': 3.94, 'peso': 13.07},\n        {'nombre': 'HSS6X6X1/8', 'nombre_staad': 'HSST6X6X0.125', 'A': 17.42, 'Ix': 645.16, 'Sx': 84.67, 'r': 6.09, 'peso': 13.67},\n        {'nombre': 'HSS4X4X1/4', 'nombre_staad': 'HSST4X4X0.25', 'A': 21.74, 'Ix': 324.66, 'Sx': 63.91, 'r': 3.86, 'peso': 17.07},\n        {'nombre': 'HSS8X8X1/8', 'nombre_staad': 'HSST8X8X0.125', 'A': 23.35, 'Ix': 1556.71, 'Sx': 153.22, 'r': 8.16, 'peso': 18.33},\n        {'nombre': 'HSS6X6X3/16', 'nombre_staad': 'HSST6X6X0.188', 'A': 25.68, 'Ix': 928.2, 'Sx': 121.81, 'r': 6.01, 'peso': 20.16},\n        {'nombre': 'HSS4X4X5/16', 'nombre_staad': 'HSST4X4X0.313', 'A': 26.45, 'Ix': 380.44, 'Sx': 74.89, 'r': 3.79, 'peso': 20.76},\n        {'nombre': 'HSS4X4X3/8', 'nombre_staad': 'HSST4X4X0.375', 'A': 30.84, 'Ix': 428.72, 'Sx': 84.39, 'r': 3.73, 'peso': 24.21},\n        {'nombre': 'HSS6X6X1/4', 'nombre_staad': 'HSST6X6X0.25', 'A': 33.81, 'Ix': 1190.42, 'Sx': 156.22, 'r': 5.93, 'peso': 26.54},\n        {'nombre': 'HSS8X8X3/16', 'nombre_staad': 'HSST8X8X0.188', 'A': 34.65, 'Ix': 2264.3, 'Sx': 222.86, 'r': 8.08, 'peso': 27.2},\n        {'nom  275.0},\n        {'nombre': 'HSS22X22X3/4', 'nombre_staad': 'HSST22X22X0.75', 'A': 375.48, 'Ix': 181060.67, 'Sx': 6480.34, 'r': 21.96, 'peso': 294.75},\n        {'nombre': 'HSS20X20X7/8', 'nombre_staad': 'HSST20X20X0.875', 'A': 392.26, 'Ix': 152756.93, 'Sx': 6014.05, 'r': 19.73, 'peso': 307.92},\n        {'nombre': 'HSS22X22X7/8', 'nombre_staad': 'HSST22X22X0.875', 'A': 434.19, 'Ix': 206867.02, 'Sx': 7403.97, 'r': 21.83, 'peso': 340.84},\n    ]\n    return perfiles\n\ndef clasificar_columnas(model):\n    \"\"\"\n    Clasifica las columnas principales en C-1, C-2, C-3 y C-4, y de viento en CV-1.\n    Devuelve un diccionario { \"C-1\": [ids], \"C-2\": [ids], ... }\n    \"\"\"\n    grupos = {\"C-1\": [], \"C-2\": [], \"C-3\": [], \"C-4\": [], \"CV-1\": []}\n    \n    # Identificar límites del modelo\n    xs = [coord[0] for coord in model.nodes.values()]\n    zs = [coord[2] for coord in model.nodes.values()]\n    \n    if not xs or not zs:\n        return grupos\n        \n    x_min, x_max = min(xs), max(xs)\n    z_min, z_max = min(zs), max(zs)\n    \n    tol = 0.1\n    \n    is_tilt_up = getattr(model, 'wall_type', '') == \"Tilt-Up\"\n    \n    if is_tilt_up:\n        # Extraer coordenadas X de las bahías de extensión\n        x_ext = []\n        if getattr(model, 'ext_bays_active', False):\n            if getattr(model, 'ext_bl', False) or getattr(model, 'ext_tl', False):\n                x_ext.append(round(model.get_x(0), 2))\n            if getattr(model, 'ext_br', False) or getattr(model, 'ext_tr', False):\n                x_ext.append(round(model.get_x(model.nSpan), 2))\n                \n        # Agrupar columnas por coordenada X\n        x_groups = {}\n        for mem_id in model.groups.get('_COL', []):\n            n1, n2 = model.members[mem_id]\n            x, y, z = model.nodes[n1]\n            rx = round(x, 2)\n            if rx not in x_groups: x_groups[rx] = []\n            x_groups[rx].append(mem_id)\n            \n        x_main_keys = [rx for rx in x_groups.keys() if rx not in x_ext]\n        \n        grupos_tiltup = {}\n        group_num = 1\n        \n        if x_main_keys:\n            x_center = (max(x_main_keys) + min(x_main_keys)) / 2.0\n            \n            # Agrupar las de main por distancia al centro\n            dist_groups = {}\n            for rx in x_main_keys:\n                d = round(abs(rx - x_center), 2)\n                if d not in dist_groups: dist_groups[d] = []\n                dist_groups[d].extend(x_groups[rx])\n                \n            sorted_dists = sorted(dist_groups.keys())\n            \n            # C-1: Centrales\n            grupos_tiltup[f\"C-{group_num}\"] = dist_groups[sorted_dists[0]]\n            group_num += 1\n            \n            # C-2: Intermedias (si hay, agrupar TODAS las distancias intermedias)\n            if len(sorted_dists) \u003e 2:\n                mid_cols = []\n                for d in sorted_dists[1:-1]:\n                    mid_cols.extend(dist_groups[d])\n                grupos_tiltup[f\"C-{group_num}\"] = mid_cols\n                group_num += 1\n                \n            # Últimos ejes completos (si son distintos de los centrales)\n            if len(sorted_dists) \u003e 1:\n                grupos_tiltup[f\"C-{group_num}\"] = dist_groups[sorted_dists[-1]]\n                group_num += 1\n                \n        # Bahías de extensión\n        ext_cols = []\n        for rx in x_ext:\n            if rx in x_groups:\n                ext_cols.extend(x_groups[rx])\n        \n        if ext_cols:\n            grupos_tiltup[f\"C-{group_num}\"] = ext_cols\n            \n        cv_cols = model.groups.get('_COLVIENTO', [])\n        if cv_cols:\n            grupos_tiltup[\"CV-1\"] = cv_cols\n            \n        return grupos_tiltup\n\n    # Lógica normal para naves metálicas\n    for mem_id in model.groups.get('_COL', []):\n        n1, n2 = model.members[mem_id]\n        x, y, z = model.nodes[n1]\n        \n        is_x_edge = abs(x - x_min) \u003c tol or abs(x - x_max) \u003c tol\n        is_z_edge = abs(z - z_min) \u003c tol or abs(z - z_max) \u003c tol\n        \n        if is_x_edge and is_z_edge:\n            grupos[\"C-4\"].append(mem_id)\n        elif is_x_edge and not is_z_edge:\n            grupos[\"C-3\"].append(mem_id)\n        elif not is_x_edge and is_z_edge:\n            grupos[\"C-2\"].append(mem_id)\n        else:\n            grupos[\"C-1\"].append(mem_id)\n            \n    for mem_id in model.groups.get('_COLVIENTO', []):\n        grupos[\"CV-1\"].append(mem_id)\n            \n    return {k: v for k, v in grupos.items() if len(v) \u003e 0}\n\ndef predisenar_grupo(nombre_grupo, model, usar_2w=False):\n    \"\"\"\n    Realiza el pre-diseño de un grupo de columnas basado en las cargas y geometría.\n    Retorna una lista con los 5 mejores perfiles que cumplen.\n    \"\"\"\n    is_wind_col = \"CV\" in nombre_grupo\n    perfiles_base = PERFILES_W if is_wind_col else generar_base_datos_or()\n    \n    if is_wind_col and not usar_2w:\n        perfiles = [p for p in perfiles_base if not p[\"nombre\"].startswith(\"WD\")]\n    else:\n        perfiles = perfiles_base\n        \n    # Heurística rápida para Muros Tilt-Up (Aproximación inicial solicitada)\n    if getattr(model, 'wall_type', '') == \"Tilt-Up\" and nombre_grupo.startswith(\"C-\"):\n        try:\n            g_idx = int(nombre_grupo.split(\"-\")[1])\n        except:\n            g_idx = 1\n            \n        if g_idx == 1:\n            target_name = \"OR 14\\\"x14\\\"x3/8\\\"\"\n            alternatives = [\"OR 14\\\"x14\\\"x1/2\\\"\", \"OR 16\\\"x16\\\"x5/16\\\"\", \"OR 16\\\"x16\\\"x3/8\\\"\", \"OR 14\\\"x14\\\"x5/16\\\"\"]\n        elif g_idx == 2:\n            target_name = \"OR 12\\\"x12\\\"x3/8\\\"\"\n            alternatives = [\"OR 12\\\"x12\\\"x1/2\\\"\", \"OR 14\\\"x14\\\"x5/16\\\"\", \"OR 14\\\"x14\\\"x1/4\\\"\", \"OR 12\\\"x12\\\"x5/16\\\"\"]\n        elif g_idx == 3:\n            target_name = \"OR 10\\\"x10\\\"x5/16\\\"\"\n            alternatives = [\"OR 10\\\"x10\\\"x3/8\\\"\", \"OR 12\\\"x12\\\"x1/4\\\"\", \"OR 12\\\"x12\\\"x5/16\\\"\", \"OR 10\\\"x10\\\"x1/4\\\"\"]\n        else:\n            target_name = \"OR 8\\\"x8\\\"x1/4\\\"\"\n            alternatives = [\"OR 8\\\"x8\\\"x5/16\\\"\", \"OR 10\\\"x10\\\"x3/16\\\"\", \"OR 10\\\"x10\\\"x1/4\\\"\", \"OR 8\\\"x8\\\"x3/16\\\"\"]\n            \n        resultados_tiltup = []\n        for p in perfiles:\n            if p[\"nombre\"] == target_name:\n                resultados_tiltup.append({\"perfil\": p, \"ratio\": 0.80})\n                break\n        for alt in alternatives:\n            for p in perfiles:\n                if p[\"nombre\"] == alt:\n                    resultados_tiltup.append({\"perfil\": p, \"ratio\": 0.85})\n                    break\n        if resultados_tiltup:\n            return resultados_tiltup\n\n    # Extraer parámetros del modelo\n    L_span = model.Larm_m\n    L_bay = model.Ljoist_m\n    H = model.HLibre_m\n    CM = model.c_muerta\n    CV = model.c_viva\n    \n    # Viento máximo\n    viento = max(model.v_barlovento, model.v_sotavento, model.v_laterales)\n    \n    # Asignar áreas tributarias y anchos tributarios de viento\n    add_wind = getattr(model, 'add_wind_cols', False)\n    w_dist = getattr(model, 'max_wind_dist', 8.0)\n    s_front = min(L_span, w_dist) if add_wind else L_span\n    s_lat = min(L_bay, w_dist) if add_wind else L_bay\n    \n    if \"CV\" in nombre_grupo:\n        At_vert = 0.0 # Las columnas de viento solo cargan su peso propio y viento\n        L_trib_viento = w_dist\n    elif \"C-4\" in nombre_grupo:\n        At_vert = (L_span / 2.0) * (L_bay / 2.0)\n        L_trib_viento = max(s_front / 2.0, s_lat / 2.0)\n    elif \"C-3\" in nombre_grupo:\n        At_vert = (L_span / 2.0) * L_bay\n        L_trib_viento = s_lat\n    elif \"C-2\" in nombre_grupo:\n        At_vert = L_span * (L_bay / 2.0)\n        L_trib_viento = s_front\n    else: # C-1\n        At_vert = L_span * L_bay\n        L_trib_viento = 0.0 # Interiores no reciben viento directo de fachada\n        \n    # Peso propio estructural estimado (joists, armaduras, lámina, etc.)\n    PP_est = 35.0 # kg/m2\n    \n    # Fuerzas estimadas (Axial)\n    P_kg = At_vert * (CM + CV + PP_est)\n    \n    # Momentos estimados (método aproximado)\n    if \"CV\" in nombre_grupo:\n        # Columna de viento (simplemente apoyada)\n        M_viento_kg_m = (viento * L_trib_viento * H**2) / 8.0\n    else:\n        # Marco Principal - Efecto de Desplazamiento Lateral (Sway)\n        # Los marcos en los extremos (C-3, C-4) reciben la mitad de carga tributaria de viento\n        is_end_frame = \"C-3\" in nombre_grupo or \"C-4\" in nombre_grupo\n        V_marco_x = viento * H * (L_bay / 2.0 if is_end_frame else L_bay)\n        \n        n_cols = model.nSpan + 1\n        V_col = V_marco_x / n_cols\n        \n        is_pinned = getattr(model, 'support_type', 'FIXED') == \"PINNED\"\n        # Si está articulado en base, el momento es mayor (V*H). Si está empotrado, se reparte (V*H/2 o menos)\n        M_sway = V_col * H if is_pinned else V_col * (H / 2.0)\n        \n        # Efecto de viento local en fachada (para perimetrales)\n        M_local = (viento * L_trib_viento * H**2) / 8.0\n        \n        # Excentricidad mínima accidental (5 cm)\n        M_grav = P_kg * 0.05\n        \n        M_viento_kg_m = max(M_sway, M_local) + M_grav\n        \n    M_viento_kg_cm = M_viento_kg_m * 100.0\n    \n    # Esfuerzo de fluencia del acero (Fy) en kg/cm2\n    # Usualmente A500 Gr. B es ~3230 kg/cm2 (46 ksi) para HSS\n    # Para perfiles W (A992) es ~3515 kg/cm2 (50 ksi)\n    Fy = 3515.0 if \"CV\" in nombre_grupo else 3230.0\n    \n    E = 2039000.0 # Módulo de elasticidad kg/cm2\n    Cc = math.sqrt(2 * math.pi**2 * E / Fy)\n    # Longitud efectiva (K) para igualar a los parámetros KZ de STAAD\n    K_val = 1.7 # Para columnas principales\n    if \"CV\" in nombre_grupo:\n        K_val = 1.4 # Para columnas de vi u003c Cc:\n                FS = (5.0/3.0) + (3.0 * klr)/(8.0 * Cc) - (klr**3)/(8.0 * Cc**3)\n                Fa_adm = (1.0 - (klr**2)/(2.0 * Cc**2)) * Fy / FS\n            else:\n                Fa_adm = (12.0 * math.pi**2 * E) / (23.0 * klr**2)\n                \n            ratio = (fa / Fa_adm) + (fb / Fb_adm)\n            if 0.2 \u003c= ratio \u003c= 1.5:\n                resultados.append({\"perfil\": perfil, \"ratio\": ratio})\n                \n    # Ordenar resultados para acercarse lo más posible a ratio 0.8\n    resultados.sort(key=lambda x: abs(0.8 - x[\"ratio\"]))\n    \n    # Evitar duplicados si relajamos el límite\n    vistos = set()\n    top_5 = []\n    for r in resultados:\n        if r[\"perfil\"][\"nombre\"] not in vistos:\n            vistos.add(r[\"perfil\"][\"nombre\"])\n            top_5.append(r)\n        if len(top_5) == 5:\n            break\n            \n    # Ordenar los top 5 finales por peso (de más ligero a más pesado)\n    top_5.sort(key=lambda x: x[\"perfil\"][\"peso\"])\n    \n    # Si aún no hay nada (muy raro), devolver los 5 más pesados\n    if not top_5:\n        return [{\"perfil\": p, \"ratio\": 0.0} for p in perfiles[-5:]]\n        \n    return top_5\n\ndef optimizar_perfil(nombre_actual, ratio_actual, es_w=False, ratio_objetivo=0.95):\n    \"\"\"\n    Propone un nuevo perfil (W u OR) calculando una Inercia objetivo.\n    Busca en la base de datos el perfil más ligero cuya Inercia sea \u003e= Inercia objetivo.\n    Si ratio_actual \u003e 1.0, sube el perfil. Si es \u003c 0.85, lo baja. (O lo acerca a 0.95 en ambos casos).\n    \"\"\"\n    if ratio_actual \u003c= 0:\n        return nombre_actual # No data\n        \n    db_or = cargar_base_datos_excel()\n    db_w = PERFILES_W\n    \n    # Identify current profile\n    perfil_actual = None\n    db_activa = db_w if es_w else db_or\n    \n    for p in db_activa:\n        if p['nombre'] == nombre_actual or p.get('nombre_staad', '') == nombre_actual:\n            perfil_actual = p  \"disconnected\",\n            \"filename\": str or None,\n            \"error\": str or None\n        }\n    \"\"\"\n    try:\n        from openstaad import ops\n        s = ops.connect()\n        filename = s.GetSTAADFile()\n        if not filename:\n            return {\"status\": \"disconnected\", \"filename\": None, \"error\": \"No file open\"}\n            \n        # For now, check if nodes exist as a proxy for a valid model, \n        # and try to check results if the function exists\n        has_results = False\n        try:\n            # Assuming AreResultsAvailable exists based on typical OpenStaad API,\n            # or we can check something else. We'll use a try/except.\n            has_results = s.AreResultsAvailable()\n        except:\n            # Fallback if the method doesn't exist in openstaad python yet, \n            # or just assume False for now.\n            pass\n            \n        status = \"connected\" if has_results else \"connected_no_results\"\n        return {\"status\": status, \"filename\": os.path.basename(filename), \"error\": None}\n        \n    except Exception as e:\n        return {\"status\": \"disconnected\", \"filename\": None, \"error\": str(e)}\n\ndef run_analysis():\n    try:\n        from openstaad import ops\n        s = ops.connect()\n        \n        import threading\n        def auto_accept():\n            import time\n            import ctypes\n            import win32gui\n            \n            # Buscamos durante 15 segundos si aparece la ventana de advertencia de STAAD\n            for _ in range(30):\n                hwnd = win32gui.GetForegroundWindow()\n                if hwnd:\n                    title = win32gui.GetWindowText(hwnd)\n                    class_name = win32gui.GetClassName(hwnd)\n                    # #32770 es la clase de sistema de Windows para un MessageBox/Dialogo\n                    if \"STAAD.Pro\" in title and class_name == \"#32770\":\n                        # Enviar tecla         const processedFiles = {};
        
        for (const [path, content] of Object.entries(rawFiles)) {
            if (typeof content === "string") {
                processedFiles[path] = content;
            } else if (content && content.base64) {
                const binStr = atob(content.base64);
                const bytes = new Uint8Array(binStr.length);
                for (let i = 0; i < binStr.length; i++) {
                    bytes[i] = binStr.charCodeAt(i);
                }
                processedFiles[path] = bytes;
            }
        }

        const splash = document.getElementById("splash-screen");
        let dismissed = false;
        let observer = null;

        function hideSessionStateWarnings() {
            const alerts = document.querySelectorAll('[data-testid="stAlert"]');
            for (let i = 0; i < alerts.length; i++) {
                const el = alerts[i];
                if (el.textContent && el.textContent.includes('was created with a default value')) {
                    el.style.display = 'none';
                }
            }
        }

        function tryDismiss() {
            hideSessionStateWarnings();
            if (dismissed) return;
            // Verificar que los botones del menú y el gráfico o título ya estén completamente dibujados
            const hasSidebarButtons = document.querySelectorAll('section[data-testid="stSidebar"] button').length >= 3;
            const hasPlotly = document.querySelector('.js-plotly-plot') || document.querySelector('[data-testid="stPlotlyChart"]');
            const hasHeading = Array.from(document.querySelectorAll('h1, h2, h3')).some(el => el.textContent.includes('Naves Industriales'));
            const hasSkeleton = document.querySelector('[data-testid="stSkeleton"]') || document.querySelector('[data-testid="stSkeletonBlock"]') || document.querySelector('.stSkeleton');

            if ((hasSidebarButtons || hasPlotly || hasHeading) && !hasSkeleton) {
                dismissed = true;
                if (observer) observer.disconnect();
                
                // Mantener un observer ligero para seguir ocultando alertas de duplicate key si el usuario interactúa
                const postObserver = new MutationObserver(hideSessionStateWarnings);
                postObserver.observe(document.getElementById("root"), { childList: true, subtree: true });

                // Dar 5.0 segundos adicionales para asegurar que todo el 3D y CSS se haya pintado suavemente
                setTimeout(() => {
                    if (splash) {
                        splash.style.opacity = "0";
                        setTimeout(() => splash.remove(), 600);
                    }
                }, 5000);
            }
        }

        observer = new MutationObserver(tryDismiss);
        observer.observe(document.getElementById("root"), { childList: true, subtree: true });

        const pollInterval = setInterval(() => {
            hideSessionStateWarnings();
            tryDismiss();
            if (dismissed) clearInterval(pollInterval);
        }, 300);

        stlite.mount({
            requirements: ["plotly"],
            entrypoint: "app/main.py",
            files: processedFiles,
            streamlitConfig: {
                "theme.primaryColor": "#005cb2",
                "theme.backgroundColor": "#ffffff",
                "theme.secondaryBackgroundColor": "#f8fafc",
                "theme.textColor": "#1e293b",
                "global.disableWidgetStateDuplicationWarning": true
            }
        }, document.getElementById("root"));
    </script>
